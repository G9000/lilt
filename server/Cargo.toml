[package]
name = "lilt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
hex = "0.4.3"
mime = "0.3.17"
rmcp = { version = "3.7.0", features = ["server", "transport-streamable-http-server", "transport-io", "macros"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17.14"
url = "2.5.8"
zeroize = "1.9.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
