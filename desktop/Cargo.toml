[package]
name = "lilt-desktop"
version = "0.1.0"
edition = "2024"
description = "Lilt as a Mac app: a window around the Lilt server, which runs on your own computer"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
