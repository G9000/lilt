<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lilt updates</title>
  <link rel="stylesheet" href="updates.css" />
  <script src="updates.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Lilt updates</h1>
      <p id="current">Reading your app version…</p>
    </header>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Checking the updater…</p>
    <p id="error" role="alert" hidden></p>
    <div id="progress-wrap" hidden>
      <label id="progress-label" for="progress">Downloading update…</label>
      <progress id="progress" aria-labelledby="progress-label"></progress>
    </div>
    <div class="actions" aria-label="Update actions">
      <button id="check" type="button" disabled>Check for updates</button>
      <button id="download" class="primary" type="button" hidden>Download update</button>
      <button id="install" class="primary" type="button" hidden>Update and restart</button>
    </div>
    <p id="hint" class="quiet">You choose when to download and restart.</p>
    <section id="release" aria-labelledby="release-title" hidden>
      <h2 id="release-title">What’s new</h2>
      <p id="notes"></p>
    </section>
  </main>
</body>
</html>
