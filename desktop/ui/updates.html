<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lilt updates</title>
  <link rel="stylesheet" href="updates.css" />
  <script src="updates.js" defer></script>
</head>
<body class="m-0 bg-page text-ink [font:15px/1.5_-apple-system,BlinkMacSystemFont,'Segoe_UI',sans-serif] [&_p]:m-0 [&_p]:[overflow-wrap:anywhere]">
  <main class="mx-auto max-w-[680px] p-7 [@media(max-width:380px)]:p-[22px]">
    <header class="mb-7">
      <h1 class="m-0 mb-1 text-[30px] font-semibold leading-[1.2] tracking-[-.035em]">Lilt updates</h1>
      <p id="current" class="text-[13px] text-ink-2">Reading your app version…</p>
    </header>
    <p id="status" class="text-[17px] font-medium" role="status" aria-live="polite" aria-atomic="true">Checking the updater…</p>
    <p id="error" class="mt-3! rounded-lg bg-fill px-3.5 py-3" role="alert" hidden></p>
    <div id="progress-wrap" class="mt-4" hidden>
      <label id="progress-label" class="mb-1.5 block text-[13px] text-ink-2" for="progress">Downloading update…</label>
      <progress id="progress" class="h-2 w-full accent-accent" aria-labelledby="progress-label"></progress>
    </div>
    <div class="actions mt-5 mb-3 flex flex-wrap gap-2.5 [@media(max-width:380px)]:flex-col [&_button]:min-h-11 [&_button]:rounded-xl [&_button]:border-0 [&_button]:bg-fill [&_button]:px-4 [&_button]:py-2.5 [&_button]:text-ink [&_button]:[font-family:inherit] [&_button]:[font-size:inherit] [&_button]:[line-height:inherit] [&_button]:font-medium [&_button]:cursor-pointer [&_button]:[transition:transform_150ms_ease-out] [&_button:hover:not(:disabled)]:bg-fill-2 [&_button:active:not(:disabled)]:[transform:scale(.97)] [&_button:focus-visible]:[outline:2px_solid_var(--color-accent-ink)] [&_button:focus-visible]:outline-offset-[3px] [&_button:disabled]:cursor-default [&_button:disabled]:opacity-50 motion-reduce:[&_button]:transition-none [&_button.primary]:bg-ink [&_button.primary]:text-page [&_button.primary:hover:not(:disabled)]:bg-ink [&_button.primary:hover:not(:disabled)]:opacity-[.85]" aria-label="Update actions">
      <button id="check" type="button" disabled>Check for updates</button>
      <button id="download" class="primary" type="button" hidden>Download update</button>
      <button id="install" class="primary" type="button" hidden>Update and restart</button>
    </div>
    <p id="hint" class="quiet text-[13px] text-ink-2">You choose when to download and restart.</p>
    <section id="release" class="mt-7 border-0 border-t border-solid border-hair pt-[22px]" aria-labelledby="release-title" hidden>
      <h2 id="release-title" class="m-0 mb-3 text-lg font-semibold leading-[1.5]">What’s new</h2>
      <p id="notes" class="whitespace-pre-wrap"></p>
    </section>
  </main>
</body>
</html>
