<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><base href="/"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accent color review</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { RoomAppearance } from '/src/room/RoomAppearance.tsx';
import { PianoRoll } from '/src/components/PianoRoll.tsx';
import { AccentPicker } from '/src/components/AccentPicker.tsx';
import '/src/styles.css';
import { practice } from '/src/ui/practice.ts';
import { roomStyles } from '/src/desk/roomStyles.ts';
const h = React.createElement;
createRoot(document.getElementById('root')).render(h(React.StrictMode, null,
  h('header', {className: ['ds-roomtop', roomStyles['ds-bar'], roomStyles['ds-roomtop']].join(' ')}, h('span', null, 'Lilt'), h(RoomAppearance)),
  h('main', {style: {padding: '70px 18px 20px', maxWidth: 640, background: 'var(--page)', color: 'var(--ink)'}},
    h('h1', null, 'Your practice'),
    h('p', {style: {color: 'var(--accent-ink)'}}, 'One comfortable next step.'),
    h(PianoRoll, {points: Array.from({length: 80}, (_, i) => ({t: i / 20, hz: 150 + 12 * Math.sin(i / 8), clarity: 1})), duration: 4, band: [130, 190], label: 'Accent preview', height: 180}),
    h('div', {className: ['fc-card', practice['fc-card']].join(' '), style: {padding: 12}}, h('a', {style: {color: 'var(--accent-ink)'}}, 'A link on a dark card')),
    ...['ve', 'vrec'].map(className => h('div', {className: [className, className === 've' ? practice.ve : practice.vrec].join(' '), key: className}, h('p', {className: ['readtext', practice.readtext].join(' ')}, h('span', {className: 'w now annotated', 'data-n': '1'}, 'Hello')))),
    h('section', {'aria-label': 'Settings appearance', style: {marginTop: 24}}, h(AccentPicker))
  )
));
</script></body></html>
